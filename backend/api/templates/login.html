<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wulkan Admin | Login</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/wulkan-crm-icon.svg') }}?v=20260610-crm">
    <meta name="theme-color" content="#101010">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/uix.css') }}?v=20260610-wulkan-palette" rel="stylesheet">
  </head>
  <body class="login-body">
    <main class="login-shell">
      <img class="login-bg-logo" src="{{ url_for('static', filename='img/logo-wulkan-admin.png') }}" alt="" aria-hidden="true">
      <div class="login-aura"></div>

      <div class="login-center">
        <section class="login-card">
          <div class="login-card-logo">
            <img src="{{ url_for('static', filename='img/logo-wulkan-admin.png') }}" alt="Wulkan Jardin Bosque Industrial Maquinaria">
          </div>
          <div class="login-kicker"><i class="bi bi-shield-lock"></i> Admin ecommerce</div>
          <div class="login-card-head">
            <span class="brand-mark"><i class="bi bi-person-lock"></i></span>
            <div>
              <h2>Iniciar sesion</h2>
              <p>Productos, stock, precios y anuncios moviles.</p>
            </div>
          </div>

          {% if error %}
          <div class="alert alert-danger border-0">{{ error }}</div>
          {% endif %}

          <form method="post" class="d-grid gap-3">
            {{ csrf_field() }}
            <div>
              <label class="form-label fw-semibold">Correo</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input class="form-control" name="email" type="email" value="{{ request.form.get('email', '') }}" placeholder="admin@empresa.com" autocomplete="email" required autofocus>
              </div>
            </div>
            <div>
              <label class="form-label fw-semibold">Contrasena</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-key"></i></span>
                <input class="form-control" name="password" type="password" placeholder="Contrasena segura" autocomplete="current-password" required>
                <button class="btn btn-outline-secondary" type="button" data-password-toggle aria-label="Mostrar contrasena" title="Mostrar contrasena">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>
            <button class="btn btn-primary btn-lg" type="submit">
              <i class="bi bi-box-arrow-in-right"></i> Entrar al panel
            </button>
          </form>

          <div class="login-meta">
            <span><i class="bi bi-phone"></i> API movil activa</span>
            <span><i class="bi bi-currency-dollar"></i> USD / VES</span>
          </div>
        </section>
      </div>
    </main>
    <script src="{{ url_for('static', filename='js/password-toggle.js') }}?v=20260610-admin-access"></script>
  </body>
</html>
