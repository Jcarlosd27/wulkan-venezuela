<div class="row g-3">
  <div class="col-12">
    <label class="form-label fw-semibold">Nombre</label>
    <input class="form-control" name="name" required value="{{ user.name if user is defined else '' }}">
  </div>
  <div class="col-12">
    <label class="form-label fw-semibold">Email</label>
    <input class="form-control" name="email" type="email" required value="{{ user.email if user is defined else '' }}">
  </div>
  <div class="col-12 col-md-6">
    <label class="form-label fw-semibold">Rol</label>
    {% set selected_role = user.role if user is defined else 'operator' %}
    <select class="form-select" name="role">
      <option value="super_admin" {% if selected_role == 'super_admin' %}selected{% endif %}>Super admin</option>
      <option value="commercial_manager" {% if selected_role == 'commercial_manager' %}selected{% endif %}>Gerente comercial</option>
      <option value="operator" {% if selected_role == 'operator' %}selected{% endif %}>Operador</option>
      <option value="sales" {% if selected_role == 'sales' %}selected{% endif %}>Ventas</option>
      <option value="inventory" {% if selected_role == 'inventory' %}selected{% endif %}>Inventario</option>
      <option value="readonly" {% if selected_role == 'readonly' %}selected{% endif %}>Solo lectura</option>
    </select>
  </div>
  <div class="col-12 col-md-6">
    <label class="form-label fw-semibold">Estado</label>
    {% set selected_status = user.status if user is defined else 'active' %}
    <select class="form-select" name="status">
      <option value="active" {% if selected_status == 'active' %}selected{% endif %}>Activo</option>
      <option value="inactive" {% if selected_status == 'inactive' %}selected{% endif %}>Inactivo</option>
      <option value="blocked" {% if selected_status == 'blocked' %}selected{% endif %}>Bloqueado</option>
    </select>
  </div>
  <div class="col-12">
    <label class="form-label fw-semibold">Contrasena</label>
    <input class="form-control" name="password" type="password" minlength="10" autocomplete="new-password" placeholder="{{ 'Dejar vacia para conservar' if user is defined else 'Crea una contrasena temporal segura' }}" {% if user is not defined %}required{% endif %}>
    <div class="form-text">Minimo 10 caracteres, con letras y numeros.</div>
  </div>
</div>
