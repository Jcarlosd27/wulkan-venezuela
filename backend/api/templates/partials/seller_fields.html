<div class="row g-3">
  <div class="col-12 col-md-7">
    <label class="form-label fw-semibold">Nombre del vendedor</label>
    <input class="form-control" name="name" required value="{{ seller.name if seller is defined else '' }}">
  </div>
  <div class="col-12 col-md-5">
    <label class="form-label fw-semibold">Codigo vendedor</label>
    <input class="form-control" name="sellerCode" value="{{ seller.sellerCode if seller is defined else '' }}" placeholder="VEN-CENTRO-01">
  </div>
  <div class="col-12 col-md-7">
    <label class="form-label fw-semibold">Email de acceso</label>
    <input class="form-control" name="email" type="email" required value="{{ seller.email if seller is defined else '' }}">
  </div>
  <div class="col-12 col-md-5">
    <label class="form-label fw-semibold">Contrasena</label>
    <div class="input-group">
      <input class="form-control" name="password" type="password" minlength="10" autocomplete="new-password" placeholder="{{ 'Dejar vacia para conservar' if seller is defined else 'Crea una contrasena temporal segura' }}" {% if seller is not defined %}required{% endif %}>
      <button class="btn btn-outline-secondary" type="button" data-password-toggle aria-label="Mostrar contrasena" title="Mostrar contrasena">
        <i class="bi bi-eye"></i>
      </button>
    </div>
  </div>
  <div class="col-12 col-md-4">
    <label class="form-label fw-semibold">Telefono</label>
    <input class="form-control" name="phone" value="{{ seller.phone if seller is defined else '' }}">
  </div>
  <div class="col-12 col-md-4">
    <label class="form-label fw-semibold">Zona</label>
    <input class="form-control" name="sellerZone" value="{{ seller.sellerZone if seller is defined else '' }}" placeholder="Caracas, Centro, Oriente">
  </div>
  <div class="col-12 col-md-4">
    <label class="form-label fw-semibold">Estado</label>
    {% set selected_status = seller.status if seller is defined else 'active' %}
    <select class="form-select" name="status">
      <option value="active" {% if selected_status == 'active' %}selected{% endif %}>Activo</option>
      <option value="inactive" {% if selected_status == 'inactive' %}selected{% endif %}>Inactivo</option>
      <option value="blocked" {% if selected_status == 'blocked' %}selected{% endif %}>Bloqueado</option>
    </select>
  </div>
  <div class="col-12 col-md-6">
    <label class="form-label fw-semibold">Comision %</label>
    <input class="form-control" name="commissionRatePercent" inputmode="decimal" value="{{ seller.commissionRatePercent if seller is defined else 0 }}">
  </div>
  <div class="col-12 col-md-6">
    <label class="form-label fw-semibold">Meta mensual USD</label>
    <input class="form-control" name="salesGoalUsd" inputmode="decimal" value="{{ seller.salesGoalUsd if seller is defined else 0 }}">
  </div>
</div>
