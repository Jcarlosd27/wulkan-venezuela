name: fventas-production
region: nyc

services:
  - name: fventas-admin
    source_dir: backend/api
    dockerfile_path: backend/api/Dockerfile
    github:
      repo: Jcarlosd27/wulkan-venezuela
      branch: main
      deploy_on_push: true
    http_port: 5000
    instance_count: 1
    instance_size_slug: basic-xs
    health_check:
      http_path: /healthz
    envs:
      - key: FVENTAS_ENV
        scope: RUN_TIME
        value: production
      - key: FVENTAS_APP_VERSION
        scope: RUN_TIME
        value: "1.0.0"
      - key: FVENTAS_BUILD_SHA
        scope: RUN_TIME
        value: digitalocean-main
      - key: FVENTAS_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
        value: replace-with-a-long-random-secret
      - key: FVENTAS_DATA_BACKEND
        scope: RUN_TIME
        value: sql
      - key: FVENTAS_DATABASE_URL
        scope: RUN_TIME
        value: ${fventas-db.DATABASE_URL}
      - key: FVENTAS_SQL_FALLBACK_TO_JSON
        scope: RUN_TIME
        value: "0"
      - key: FVENTAS_REQUIRE_MOBILE_TOKEN
        scope: RUN_TIME
        value: "1"
      - key: FVENTAS_REJECT_LEGACY_MOBILE_TOKENS
        scope: RUN_TIME
        value: "1"
      - key: FVENTAS_REQUIRE_MOBILE_DEVICE_HEADER
        scope: RUN_TIME
        value: "1"
      - key: FVENTAS_ALLOW_LEGACY_MOBILE_API
        scope: RUN_TIME
        value: "0"
      - key: FVENTAS_READYZ_PUBLIC_DETAILS
        scope: RUN_TIME
        value: "0"
      - key: FVENTAS_CSP_REPORT_ONLY
        scope: RUN_TIME
        value: "0"
      - key: FVENTAS_TRUST_PROXY_HEADERS
        scope: RUN_TIME
        value: "1"
      - key: FVENTAS_LANDING_ACCESS_PREFERENCE_WINDOW_SECONDS
        scope: RUN_TIME
        value: "60"
      - key: FVENTAS_LANDING_ACCESS_PREFERENCE_MAX_EVENTS
        scope: RUN_TIME
        value: "12"
      - key: FVENTAS_SIGNUP_WINDOW_SECONDS
        scope: RUN_TIME
        value: "300"
      - key: FVENTAS_SIGNUP_MAX_EVENTS
        scope: RUN_TIME
        value: "5"
      - key: FVENTAS_ACCOUNT_DELETION_WINDOW_SECONDS
        scope: RUN_TIME
        value: "300"
      - key: FVENTAS_ACCOUNT_DELETION_MAX_EVENTS
        scope: RUN_TIME
        value: "5"
      - key: FVENTAS_MOBILE_PASSWORD_RECOVERY_WINDOW_SECONDS
        scope: RUN_TIME
        value: "300"
      - key: FVENTAS_MOBILE_PASSWORD_RECOVERY_MAX_EVENTS
        scope: RUN_TIME
        value: "5"
      - key: FVENTAS_STORAGE_BACKEND
        scope: RUN_TIME
        value: s3
      - key: FVENTAS_STORAGE_PUBLIC_BASE_URL
        scope: RUN_TIME
        value: https://fventas-assets.atl1.cdn.digitaloceanspaces.com
      - key: FVENTAS_S3_BUCKET
        scope: RUN_TIME
        value: fventas-assets
      - key: FVENTAS_S3_REGION
        scope: RUN_TIME
        value: atl1
      - key: FVENTAS_S3_ENDPOINT_URL
        scope: RUN_TIME
        value: https://atl1.digitaloceanspaces.com
      - key: FVENTAS_S3_PREFIX
        scope: RUN_TIME
        value: production
      - key: FVENTAS_S3_ACL
        scope: RUN_TIME
        value: public-read
      - key: AWS_ACCESS_KEY_ID
        scope: RUN_TIME
        type: SECRET
        value: replace-with-digitalocean-spaces-key
      - key: AWS_SECRET_ACCESS_KEY
        scope: RUN_TIME
        type: SECRET
        value: replace-with-digitalocean-spaces-secret
      - key: FVENTAS_LOGIN_MAX_ATTEMPTS
        scope: RUN_TIME
        value: "5"
      - key: FVENTAS_LOGIN_WINDOW_SECONDS
        scope: RUN_TIME
        value: "300"
      - key: FVENTAS_MAX_UPLOAD_MB
        scope: RUN_TIME
        value: "16"
      - key: FVENTAS_BACKUP_DIR
        scope: RUN_TIME
        value: backups
      - key: FVENTAS_LOG_LEVEL
        scope: RUN_TIME
        value: INFO
      - key: FVENTAS_WEB_WORKERS
        scope: RUN_TIME
        value: "1"
      - key: FVENTAS_WEB_THREADS
        scope: RUN_TIME
        value: "4"
      - key: FVENTAS_GUNICORN_TIMEOUT
        scope: RUN_TIME
        value: "60"
      - key: FVENTAS_GUNICORN_MAX_REQUESTS
        scope: RUN_TIME
        value: "600"
      - key: FVENTAS_GUNICORN_MAX_REQUESTS_JITTER
        scope: RUN_TIME
        value: "60"
      - key: FVENTAS_DB_POOL_SIZE
        scope: RUN_TIME
        value: "2"
      - key: FVENTAS_DB_MAX_OVERFLOW
        scope: RUN_TIME
        value: "2"
      - key: FVENTAS_DB_POOL_RECYCLE_SECONDS
        scope: RUN_TIME
        value: "1800"
      - key: FVENTAS_RUN_MIGRATIONS
        scope: RUN_TIME
        value: "1"
      - key: FVENTAS_HARDEN_DEFAULT_ACCOUNTS
        scope: RUN_TIME
        value: "1"
      - key: FVENTAS_BOOTSTRAP_ON_START
        scope: RUN_TIME
        value: "0"
      - key: FVENTAS_BOOTSTRAP_RESET_PASSWORDS
        scope: RUN_TIME
        value: "0"

databases:
  - name: fventas-db
    engine: PG
    version: "16"
    production: true
