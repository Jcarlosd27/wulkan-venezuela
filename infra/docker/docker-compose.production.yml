services:
  api:
    build:
      context: ../../backend/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      FVENTAS_ENV: production
      FVENTAS_DATA_BACKEND: sql
      FVENTAS_SQL_FALLBACK_TO_JSON: "0"
      FVENTAS_REQUIRE_MOBILE_TOKEN: "1"
      FVENTAS_DATABASE_URL: ${FVENTAS_DATABASE_URL:-}
      FVENTAS_RUN_MIGRATIONS: ${FVENTAS_RUN_MIGRATIONS:-1}
    command: ["./scripts/start_web.sh"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
