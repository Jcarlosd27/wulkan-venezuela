name: Production checks

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend:
    name: Backend Flask
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile backend
        run: |
          python -m py_compile app.py store.py sql_store.py config.py db.py models.py storage.py wsgi.py \
            scripts/seed_database.py scripts/create_admin.py scripts/backup_database.py scripts/restore_database.py scripts/smoke_production.py \
            migrations/env.py migrations/versions/*.py

      - name: Run migrations
        run: python -m alembic upgrade head

      - name: Smoke Flask app
        run: |
          python - <<'PY'
          from app import app
          client = app.test_client()
          for path in ("/healthz", "/readyz", "/api/mobile/products"):
              response = client.get(path)
              assert response.status_code == 200, (path, response.status_code, response.data[:200])
          PY

  mobile:
    name: Flutter mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
